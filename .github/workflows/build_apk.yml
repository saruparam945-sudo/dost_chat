name: Build DostChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Android & Firebase
        run: |
          flutter create . --org com.dostchat --project-name dost_chat
          cp *.json android/app/google-services.json
          sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle.kts || sed -i 's/com.android.application/com.android.application"\n    id "com.google.gms.google-services/' android/app/build.gradle
          sed -i 's/dependencies {/dependencies {\n        classpath("com.google.gms:google-services:4.4.2")/' android/settings.gradle.kts || true
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DostChat-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
